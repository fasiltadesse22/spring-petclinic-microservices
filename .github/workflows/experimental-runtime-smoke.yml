name: Experimental real Config Server smoke
on:
  push:
    branches: [stabilization/safe-local-supervision-readiness]
permissions:
  contents: read
jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build real JVM artifacts
        run: ./mvnw -B -DskipTests package
      - name: Verify disposable Config Server process and health
        run: bash scripts/smoke_config_server.sh
